<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style.css">
        <title>Rock, Paper, Scissors</title>
    </head>
    <body>
        <div class="content">
            <h1>Rock, Paper, Scissors</h1>
    
            <div class="content-container">
                <div class="score-container">
                    <div class="human-score-container">
                        <h2>You</h2>
                        <span class="human-score">0</span>
                    </div>
                    <div class="computer-score-container">
                        <span class="computer-score">0</span>
                        <h2>CPU</h2>
                    </div>
                </div>
        
                <div class="button-container">
                    <button type="button" id="rock">Rock</button>
                    <button type="button" id="paper">Paper</button>
                    <button type="button" id="scissors">Scissors</button>

                    <button type="button" id="reset" hidden>Reset Game</button>
                </div>
            </div>
            <p class="message"></p>
        </div>

        <script src="./script.js"></script>
    </body>
</html>
